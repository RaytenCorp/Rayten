- type: entity
  parent: [ClothingBeltBase, ClothingSlotBase, FirstSyndicateContraband]
  id: ClothingBeltSheathSyndicate
  name: ножны для рапиры
  description: Зловещие тонкие ножны, подходящие для рапиры.
  components:
  - type: Sprite
    sprite: Vanilla/Clothing/Belt/syndie_sheath.rsi
    state: sheath
  - type: Clothing
    sprite: Vanilla/Clothing/Belt/syndie_sheath.rsi
  - type: Item
    size: Ginormous
  - type: ItemSlots
    slots:
      item:
        name: rapier
        insertVerbText: sheath-insert-verb
        ejectVerbText: sheath-eject-verb
        insertSound: /Audio/Items/sheath.ogg
        ejectSound: /Audio/Items/unsheath.ogg
        whitelist:
          tags:
          - SyndicateRapier
  - type: ItemMapper
    mapLayers:
      sheath-rapier:
        whitelist:
          tags:
          - SyndicateRapier
  - type: Appearance


- type: entity
  id: ClothingBeltSheathSyndicateFilled
  parent: ClothingBeltSheathSyndicate
  suffix: Filled
  components:
  - type: ContainerFill
    containers:
      item:
      - SyndicateRapier

- type: entity
  parent: [BaseItem, SecondSyndicateContraband]
  id: BeltSheathSyndieFilledBox
  name: завёрнутая рапира Синдиката
  description: Разверни меня.
  components:
  - type: Item
    size: Normal
    shape:
    - 0,0,0,6
  - type: Sprite
    sprite: Vanilla/Objects/Storage/sheath_rapier_gift.rsi
    state: icon
  - type: SpawnItemsOnUse
    items:
    - id: ClothingBeltSheathSyndicateFilled
    sound:
      path: /Audio/Effects/unwrap.ogg