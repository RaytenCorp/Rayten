- type: entity
  parent: BaseAction
  id: Action173Scrug
  name: Сломать шею
  description: переместись за спину и свернуть шею в момент, когда никто не видит
  components:
  - type: Action
    itemIconStyle: BigAction
    useDelay: 10
    icon:
      sprite: Vanilla/Actions/Archon.rsi
      state: neck_snap
    priority: -98
  - type: TargetAction
    interactOnMiss: false
    checkCanAccess: false # чекаем самостоятельно, т.к. нам важны собственные попупы
    range: 20
  - type: EntityTargetAction
    whitelist:
      components:
      - MobState
    canTargetSelf: false
    event: !type:ScragEvent

- type: entity
  parent: BaseAction
  id: Action173Teleport
  name: телепортироваться
  description: переместись в пространстве в момент, когда никто не видит
  components:
  - type: Action
    itemIconStyle: BigAction
    useDelay: 3
    icon:
      sprite: Vanilla/Actions/Archon.rsi
      state: teleport
    priority: -99
  - type: TargetAction
    checkCanAccess: false # чекаем самостоятельно, т.к. нам важны собственные попупы
    range: 20
  - type: WorldTargetAction
    event: !type:SculptureTeleportEvent

- type: entity
  parent: BaseAction
  id: Action106Teleport
  name: Телепотироваться
  description: Переместиться в ваше карманное измерение либо обратно на станцию.
  components:
  - type: Action
    itemIconStyle: BigAction
    useDelay: 120
    icon:
      sprite: Vanilla/Actions/Archon.rsi
      state: teleport
    priority: -99
  - type: InstantAction
    event: !type:OldManTeleportEvent

- type: entity
  parent: BaseAction
  id: Action939Exo
  name: Эхолокация
  description: Увидеть всех, кто быстро передвигается
  components:
  - type: Action
    itemIconStyle: BigAction
    useDelay: 30
    icon:
      sprite: Vanilla/Actions/Archon.rsi
      state: echo
    priority: -99
  - type: InstantAction
    event: !type:WithManyVoicesExoEvent

- type: entity
  parent: BaseAction
  id: Action049Surgery
  name: Провести операцию
  description: Провести хирургическую операцию над трупом уменьшив общий уровень поветрия.
  components:
  - type: Action
    itemIconStyle: BigAction
    useDelay: 180
    icon:
      sprite: Vanilla/Actions/Archon.rsi
      state: surgery
  - type: TargetAction
    interactOnMiss: false
    range: 2
  - type: EntityTargetAction
    whitelist:
      components:
      - MobState
      - Bloodstream
    canTargetSelf: false
    event: !type:Surgery049Event

- type: entity
  parent: BaseAction
  id: Action049MarkVictim
  name: Отметить жертву
  description: Кто-то вам сильно мешает? Отметьте его меткой для убийства! Увеличивает уровень поветрия на 20 ед.
  components:
  - type: Action
    itemIconStyle: BigAction
    useDelay: 180
    icon:
      sprite: Vanilla/Actions/Archon.rsi
      state: makevictim
  - type: TargetAction
    interactOnMiss: false
    range: 18
  - type: EntityTargetAction
    whitelist:
      components:
      - MobState
      - Bloodstream
      - PredatorVisibleMark
    canTargetSelf: false
    event: !type:MarkVictim049Event

- type: entity
  parent: BaseAction
  id: Action068OrderFollow
  name: Следовать
  description: Прикажите своим копиям следовать за вами.
  components:
  - type: Action
    useDelay: 1
    icon:
      sprite: Vanilla/Actions/Archon.rsi
      state: figurineFollow
    priority: 6
  - type: InstantAction
    event: !type:FigurineOrderActionEvent
      order: Follow

- type: entity
  parent: BaseAction
  id: Action068OrderEat
  name: преобразуйте металл
  description: Прикажите своим копиям преобразовывать металл в новые копии.
  components:
  - type: Action
    useDelay: 1
    icon:
      sprite: Vanilla/Actions/Archon.rsi
      state: figurineEat
    priority: 7
  - type: InstantAction
    event: !type:FigurineOrderActionEvent
      order: Eat
