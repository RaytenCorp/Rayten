- type: utilityQuery
  id: NearbyPredatorTargets
  query:
    - !type:ComponentQuery
      components:
      - type: PredatorVisibleMark
  considerations:
    - !type:TargetIsVisibleByPredatorCon
      curve: !type:BoolCurve
    - !type:TargetIsAliveCon
      curve: !type:BoolCurve
    - !type:TargetDistanceCon
      curve: !type:PresetCurve
        preset: TargetDistance
    - !type:TargetHealthCon
      curve: !type:PresetCurve
        preset: TargetHealth


- type: utilityQuery
  id: NearbyEatable
  query:
    # - !type:TagsQuery
    #   tags:
    #   - Wall
    #   - Structure
    - !type:ComponentQuery
      components:
      - type: Door
    - !type:ComponentFilter
      retainWithComp: false
      components:
      - type: EatenMetal
  considerations:
    - !type:TargetDistanceCon
      curve: !type:PresetCurve
        preset: TargetDistance
    - !type:TargetAccessibleCon
      curve: !type:BoolCurve
    - !type:TargetInLOSOrCurrentCon
      curve: !type:BoolCurve
