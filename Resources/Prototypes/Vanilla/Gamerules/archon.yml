- type: entity
  id: ArchonEventScheduler
  parent: BaseGameRule
  components:
  - type: BasicStationEventScheduler
    minimumTimeUntilFirstEvent: 600 #10 минут
    minMaxEventTiming:
      min: 900 # 15 мин
      max: 1500 # 25 мин
    scheduledGameRules: !type:NestedSelector
      tableId: ArchonEventsTable

- type: entity
  parent: BaseGameRule
  id: BaseArchonGameRule
  components:
  - type: StationEvent
    startAnnouncement: station-event-archon-incoming
    startAudio:
      path: /Audio/Announcements/attention.ogg
    maxOccurrences: 1

- type: entity
  parent: BaseArchonGameRule
  id: KeterArchonGameRule
  components:
  - type: StationEvent
    earliestStart: 35
    minimumPlayers: 15
    startAnnouncement: station-event-archon-incoming-keter
    startAudio:
      path: /Audio/Vanilla/Announcements/scp-intercom.ogg
    weight: 1

- type: entity
  parent: BaseArchonGameRule
  id: EuclidArchonGameRule
  components:
  - type: StationEvent
    minimumPlayers: 15
    startAnnouncement: station-event-archon-incoming-euclid
    startAudio:
      path: /Audio/Vanilla/Announcements/scp-intercom.ogg
    weight: 2

- type: entity
  parent: BaseArchonGameRule
  id: SafeArchonGameRule
  components:
  - type: StationEvent
    startAnnouncement: station-event-archon-incoming-safe
    weight: 5

- type: entityTable
  id: ArchonEventsTable
  table: !type:AllSelector
    children:
    #кетер
    - id: OldManSpawn
    - id: BlindPredatorSpawn
    # - id: PossessiveMaskSpawn todo
    #евклид
    - id: PlagueDoctorSpawn
    - id: ShyGuySpawn
    - id: SculptureSpawn
    - id: SuperBallSpawn
    #безопасный
    - id: PanaceaSpawn
    - id: MasterKeySpawn
    - id: HatInvisibleSpawn
    - id: InfinityFlaskSpawn
    - id: LivingWeaponSpawn
    - id: DontTakeMoreThanTwoSpawn
    - id: MastersFeatherSpawn
    # - id: JadedRingSpawn todo
    # - id: GasMaskSpawn todo

- type: entity
  parent: KeterArchonGameRule
  id: BlindPredatorSpawn
  components:
  - type: RandomSpawnRule
    prototype: MobWithManyVoicesArchon939

- type: entity
  parent: KeterArchonGameRule
  id: OldManSpawn
  components:
  - type: StationEvent
    duration: null
  - type: AntagObjectives
    objectives:
    - OldManEatObjective
  - type: AntagRandomSpawn
  - type: AntagSpawner
    prototype: MobArchonOldMan106
  - type: AntagSelection
    agentName: old-man-round-end-agent-name
    antags:
    - !type:FixedAntagCount
      proto: OldMan

#евклид
- type: entity
  parent: EuclidArchonGameRule
  id: PlagueDoctorSpawn
  components:
  - type: StationEvent
    duration: null
  - type: AntagObjectives
    objectives:
    - PlagueDoctorPestilenceObjective
    - PlagueDoctorLivingObjective
  - type: AntagRandomSpawn
  - type: AntagSpawner
    prototype: MobArchonPlagueDoctor049
  - type: AntagSelection
    agentName: old-man-round-end-agent-name
    antags:
    - !type:FixedAntagCount
      proto: PlagueDoctor

- type: entity
  parent: EuclidArchonGameRule
  id: SculptureSpawn
  components:
  - type: RandomSpawnRule
    prototype: MobSculptureArchon173

- type: entity
  parent: EuclidArchonGameRule
  id: ShyGuySpawn
