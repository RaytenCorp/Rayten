- type: entity
  parent: [ClothingEyesBase, SecondSecurityContraband]
  id: ClothingEyesThermalGlassesEmpty
  name: термальные очки
  suffix: Пустой
  description: Пара сложных очков с наложенной матрицей сенсоров, способной регистрировать тепловое излучение в пределах видимого спектра. Линзы мерцают слабым красноватым свечением.
  components:
  - type: Sprite
    sprite: Vanilla/Clothing/Eyes/Hud/thermal_glasses.rsi
    layers:
      - state: icon
      - state: icon-on
        visible: true
        shader: unshaded
        map: [ "enum.ToggleableVisuals.Layer" ]
  - type: Appearance
  - type: Clothing
    sprite: Vanilla/Clothing/Eyes/Hud/thermal_glasses.rsi
    equippedPrefix: off
  - type: ToggleableVisuals
    spriteLayer: enum.ToggleableVisuals.Layer
    clothingVisuals:
      eyes:
      - state: on-equipped-EYES
        shader: unshaded
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: {visible: true}
          False: {visible: false}
  - type: ToggleClothing
    action: ActionToggleThermalVision
    mustEquip: true
    disableOnUnequip: true
  - type: ItemToggle
    onUse: false
    onActivate: false
    predictable: false
    soundActivate:
      path: /Audio/Vanilla/Effects/Actions/nightvisionswitch.ogg
    soundDeactivate:
      path: /Audio/Machines/button.ogg
    soundFailToActivate:
      path: /Audio/Machines/button.ogg
  - type: ItemToggleActiveSound
    activeSound:
      path: /Audio/Vanilla/Effects/Actions/nightvisionambient.ogg
      params:
        volume: -4
        maxDistance: 5
  - type: ComponentToggler
    components:
    - type: ThermalVisionOverlay
  - type: PowerCellSlot
    cellSlotId: cell_slot
  - type: ContainerContainer
    containers:
      cell_slot: !type:ContainerSlot
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
  - type: PowerCellDraw
    drawRate: 2
    useRate: 20
  - type: ToggleCellDraw
  - type: IdentityBlocker
    coverage: EYES

- type: entity
  parent: ClothingEyesThermalGlassesEmpty
  id: ClothingEyesThermalGlasses
  suffix: Заполнен
  components:
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellSmall


- type: entity
  parent: BaseAction
  id: ActionToggleThermalVision
  name: Активировать термальное зрение
  description: Активировать термальные сенсоры для слежения за тепловыми источниками.
  components:
  - type: Action
    useDelay: 5
    itemIconStyle: BigItem
  - type: InstantAction
    event: !type:ToggleActionEvent