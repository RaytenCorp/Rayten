- type: entity
  name: Syndicate stunbaton
  parent: [BaseItem, ThirdSyndicateContraband]
  id: Syndicate_stunbaton
  description: A lightweight and powerful shock baton for stunning a target.
  components:
  - type: Sprite
    sprite: Vanilla/Objects/Weapons/Melee/syndicate_baton.rsi
    layers:
    - state: icon
      map: [ "enum.ToggleableVisuals.Layer" ]   
  - type: Item
    sprite: Vanilla/Objects/Weapons/Melee/syndicate_baton.rsi
    size: Small
  - type: Stunbaton
    energyPerUse: 125
  - type: ItemToggle
    predictable: false
    soundActivate:
      collection: sparks
      params:
        variation: 0.250
    soundDeactivate:
      collection: sparks
      params:
        variation: 0.250
    soundFailToActivate:
      path: /Audio/Machines/button.ogg
      params:
        variation: 0.250
  - type: ItemTogglePrefix
    prefixOn: on
    prefixOff: off
  - type: ItemToggleMeleeWeapon
    activatedDamage:
      types:
        Blunt: 0
  - type: MeleeWeapon
    wideAnimationRotation: -135
    damage:
      types:
        Blunt: 0
    angle: 60
    animation: WeaponArcThrust
  - type: StaminaDamageOnHit
    damage: 60
    sound: /Audio/Weapons/egloves.ogg
  - type: StaminaDamageOnCollide
    damage: 60
    sound: /Audio/Weapons/egloves.ogg
  - type: LandAtCursor 
  - type: PredictedBattery
    maxCharge: 1000
    startingCharge: 1000
  - type: ItemToggleSize
    activatedSize: Normal
  - type: Clothing
    sprite:  Vanilla/Objects/Weapons/Melee/syndicate_baton.rsi
    quickEquip: false
    slots:
    - Belt
  - type: DisarmMalus
    malus: 0.225
  - type: Appearance
  - type: GenericVisualizer
    visuals:
     enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: {state: icon}
          False: {state: icon-off}
  - type: Riggable
  - type: SolutionContainerManager
    solutions:
      battery:
        maxVol: 5
  - type: InjectableSolution
    solution: battery
  - type: DrawableSolution
    solution: battery
  - type: Explosive
    explosionType: Default
    intensitySlope: 1.5
    maxIntensity: 200
  - type: PredictedBatterySelfRecharger
    autoRechargeRate: 50
    autoRechargePauseTime: 5
