- type: entity
  id: ArchonLocatorUnpowered
  name: локатор архонтов
  description: Устройство, предназначенное для помощи в поиске архонтов. Вы уже проверили торговый пост?
  parent: AnomalyLocatorUnpowered
  suffix: Всегда заряжен
  components:
  - type: Sprite
    sprite: Vanilla/Objects/Specific/Research/archonlocator.rsi
    layers:
      - state: icon
      - state: screen
        shader: unshaded
        visible: false
        map: ["enum.ToggleableVisuals.Layer"]
  - type: ProximityDetector
    range: 20
    components:
    - type: Archon

- type: entity
  id: ArchonLocator
  parent: [ ArchonLocatorUnpowered, PowerCellSlotSmallItem ]
  suffix: ""
  components:
  - type: PowerCellDraw
    drawRate: 1
    useCharge: 0
  - type: ToggleCellDraw

- type: entity
  id: ArchonLocatorEmpty
  parent: ArchonLocator
  suffix: Empty
  components:
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
