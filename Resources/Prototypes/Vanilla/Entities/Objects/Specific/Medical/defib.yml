- type: entity
  id: AdvancedDefibrillator
  parent: [BaseDefibrillator, BaseGrandTheftContraband]
  name: Продвинутый дефибриллятор
  description: Одноручный, компактный, не требует зарядки. Делает "ББЗ!" так-же хорошо, как и обычный дефибриллятор.
  components:
    - type: Sprite
      sprite: Vanilla/Objects/Specific/Medical/advanced_defib.rsi
      layers:
        - state: defib
        - state: defib-on
          map: [ "enum.ToggleableVisuals.Layer" ]
          visible: false
          shader: unshaded
    - type: GenericVisualizer
      visuals:
        enum.ToggleableVisuals.Enabled:
          enum.ToggleableVisuals.Layer:
            True: { visible: true }
            False: { visible: false }
    - type: Item
      size: Normal
    - type: Clothing
      quickEquip: false
      slots:
      - Belt
    - type: Tag
      tags:
      - HighRiskItem
    - type: StealTarget
      stealGroup: AdvancedDefibrillator