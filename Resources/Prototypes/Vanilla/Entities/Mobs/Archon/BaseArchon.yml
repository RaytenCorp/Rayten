- type: entity
  name: Архонт-объект моб
  id: BaseMobArchon
  parent: [ SimpleSpaceMobBase, MobCombat ]
  abstract: true
  components:
  - type: Skill
    basicSkills:
      Weapon: 2
  - type: ComplexInteraction
  - type: Puller
    needsHands: false
  - type: Hands
    showInHands: false
    disableExplosionRecursion: true
    canBeStripped: false
  - type: NightVision
  - type: PointLight
    radius: 9
    energy: 3.5
    color: "#013220"
    enabled: false
    netsync: false
  - type: NameIdentifier
    group: null
  - type: ZombieImmune
  - type: InjectionProtection
  - type: NoSlip
  - type: PreventInserting
  - type: Insulated
  - type: Snoring
  - type: SleepEmitSound
  - type: FlashImmunity
    showInExamine: false
  - type: Bloodstream
    bloodRefreshAmount: 7
    bleedReductionAmount: 1
  - type: DangerMob
  - type: Archon
  - type: InputMover
  - type: MobMover
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: CombatMode
  - type: MeleeWeapon
    altDisarm: false
    angle: 45
    attackRate: 2
    animation: WeaponArcBite
    soundHit:
      collection: Punch
    damage:
      types:
        Blunt: 35
  - type: Physics
  - type: MobState
  - type: MobThresholds
    thresholds:
      0: Alive
      1000: Dead
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1000
      behaviors:
      - !type:GibBehavior
        recursive: false
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialParaxit1:
            min: 1
            max: 5
  - type: SlowOnDamage
    speedModifierThresholds:
      400: 0.7
      600: 0.5
      900: 0.3
  - type: Damageable
    damageModifierSet: StrongArchon
  - type: PassiveDamage
    damageCap: 1000
    allowedStates:
    - Alive
    - Critical
    damage:
      groups:
        Brute: -10
        Burn: -10
        Toxin: -2
        Genetic: -0.5
        Airloss: -0.5
  - type: Stamina
    stunTime: 1.25
  - type: MovementSpeedModifier
    baseWalkSpeed: 1.5
    baseSprintSpeed: 1.5
  - type: Tag
    tags:
      - DoorBumpOpener
      - CannotSuicide
