- type: entity
  name: Архонт-объект моб
  id: BaseMobArchon
  parent: [ SimpleSpaceMobBase, MobCombat ]
  abstract: true
  components:
  - type: Skill
    basicSkills:
      Weapon: 2
  - type: ComplexInteraction
  - type: Puller
    needsHands: false
  - type: Hands
    showInHands: false
    disableExplosionRecursion: true
    canBeStripped: false
  - type: NightVision
  - type: PointLight
    radius: 9
    energy: 3.5
    color: "#013220"
    enabled: false
    netsync: false
  - type: NameIdentifier
    group: null
  - type: ZombieImmune
  - type: InjectionProtection
  - type: NoSlip
  - type: PreventInserting
  - type: Insulated
  - type: Snoring
  - type: SleepEmitSound
  - type: FlashImmunity
    showInExamine: false
  - type: Bloodstream
    bloodRefreshAmount: 7
    bleedReductionAmount: 1
  - type: DangerMob
  - type: Archon
  - type: InputMover
  - type: MobMover
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: CombatMode
  - type: MeleeWeapon
    altDisarm: false
    angle: 45
    attackRate: 2
    animation: WeaponArcBite
    soundHit:
      collection: Punch
    damage:
      types:
        Blunt: 35
  - type: Physics
  - type: MobState
  - type: MobThresholds
    thresholds:
      0: Alive
      1000: Dead
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1000
      behaviors:
      - !type:GibBehavior
        recursive: false
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialParaxit1:
            min: 1
            max: 5
  - type: SlowOnDamage
    speedModifierThresholds:
      800: 0.7
  - type: Damageable
    damageModifierSet: StrongArchon
  - type: PassiveDamage
    damageCap: 1000
    allowedStates:
    - Alive
    - Critical
    damage:
      types:
        Blunt: -5
        Piercing: -5
        Slash: -5
        Poison: -0.3
        Radiation: -0.3
        Cellular: -0.15
        Asphyxiation: -3
        Bloodloss: -3
        Cold: -3
        Heat: -3
        Caustic: -3
        Shock: -3
  - type: Stamina
    stunTime: 1.25
  - type: MovementSpeedModifier
    baseWalkSpeed: 1.5
    baseSprintSpeed: 1.5
  - type: Tag
    tags:
      - DoorBumpOpener
      - CannotSuicide

- type: entity
  name: Сильный архонт
  id: MobStrongArchon
  parent: BaseMobArchon
  abstract: true
  components:
  - type: MobThresholds
    thresholds:
      0: Alive
      700: Dead
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 700
      behaviors:
      - !type:GibBehavior
        recursive: false
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialParaxit1:
            min: 1
            max: 5
  - type: Damageable
    damageModifierSet: StrongArchon
  - type: SlowOnDamage
    speedModifierThresholds:
      500: 0.8
  - type: PassiveDamage
    damageCap: 700
    allowedStates:
    - Alive
    - Critical
    damage:
      types:
        Blunt: -1.5
        Piercing: -1.5
        Slash: -1.5
        Poison: -0.5
        Radiation: -0.15
        Cellular: -0.15
        Asphyxiation: -2
        Bloodloss: -2
        Cold: -1.5
        Heat: -1.5
        Caustic: -1.5
        Shock: -1.5

