- type: entity
  parent: MobStrongArchon
  id: MobArchonOldMan106
  name: Старик
  description: выглядит как пожилой гуманоид на поздней стадии разложения.
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: Vanilla/Mobs/Archons/OldMan.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: base
    - map: ["enum.DamageStateVisualLayers.BaseUnshaded"]
      state: eyes
      shader: unshaded
  - type: OldMan
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: Corrosion
        Quantity: 300
  - type: Muted
  - type: Archon
    researchCoolDown: 5m
  - type: MeleeWeapon
    attackRate: 0.4
    soundHit: /Audio/Vanilla/Effects/Archon/106/106meleeattack.ogg
    damage:
      types:
        Structural: 25
        Blunt: 20
  - type: StaminaDamageOnHit
    damage: 200
  - type: SleepEmitSound
    snore: /Audio/Vanilla/Effects/Archon/106/106breathing.ogg
  - type: AmbientSound
    volume: -12
    range: 25
    sound: /Audio/Vanilla/Ambience/106/106Bump-In-The-Night.ogg
  - type: HTN
    rootTask:
      task: MeleeCombatCompound
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.25
        density: 600
        restitution: 0
        friction: 0.4
        mask:
        - SmallMobMask
        layer:
        - SmallMobLayer
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: MovementSpeedModifier
    baseWalkSpeed: 1.5
    baseSprintSpeed: 2.5
  - type: TimedSpawner
    prototypes:
      - DecalSpawnerBurns
    chance: .25
    intervalSeconds: 5
    minimumEntitiesSpawned: 1
    maximumEntitiesSpawned: 2
  - type: FootstepModifier
    footstepSoundCollection:
      collection: Footsteps106
      params:
        volume: 5
  - type: Tag
    tags:
      - FootstepSound
      - CannotSuicide


- type: polymorph
  id: OldManJaunt
  configuration:
    entity: OldManJaunt
    transferName: true
    inventory: None
    forced: false
    revertOnDeath: true
    revertOnCrit: true
    allowRepeatedMorphs: false
    polymorphPopup: null
    exitPolymorphPopup: null
    duration: 30


- type: entity
  name: нечто под полом
  parent:
  - Incorporeal
  - BaseMob
  id: OldManJaunt
  suffix: Старик
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/magic.rsi
    layers:
    - state: magicm_cyan
      shader: unshaded
      color: Black
    overrideContainerOcclusion: true
    drawdepth: Ghosts
  - type: MovementSpeedModifier
    baseSprintSpeed: 9
    baseWalkSpeed: 3
  - type: Eye
    drawFov: false
  - type: ContentEye
    maxZoom: 1.44,1.44
  - type: OldManPolymorph
  - type: RepeatingTrigger
    delay: 0.1
  - type: SpawnOnTrigger
    proto: OldManJumpTrack
  - type: Actions

- type: entity
  categories: [ HideSpawnMenu ]
  id: OldManJumpTrack
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/magic.rsi
    overrideContainerOcclusion: true
    drawdepth: Ghosts
    layers:
    - state: magicm_cyan
      shader: unshaded
      color: Black
  - type: TimedDespawn
    lifetime: .5

- type: entity
  categories: [ HideSpawnMenu ]
  id: PDEnterPortal
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: Vanilla/Mobs/Archons/OldMan.rsi
    loop: false
    offset: 0, -0.1
    layers:
    - state: lusha
      shader: unshaded
  - type: PDlusha
  - type: TimedDespawn
    lifetime: 5


- type: weightedRandom
  id: DimnsionVictimResults
  weights:
    Kill: 6
    Revive: 2
    Eat: 2
