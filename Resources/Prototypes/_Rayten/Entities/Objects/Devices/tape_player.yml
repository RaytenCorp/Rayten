- type: entity
  parent: BaseItem
  id: TapePlayer
  name: Кассетный проигрыватель
  description: Революция музыкального исскуства, убийца музыкантов.
  components:
  - type: Appearance
  - type: Sprite
    sprite: _Rayten/Objects/Devices/tape_player.rsi
    state: icon
  - type: TapePlayer
    rolloffFactor: 3
    maxDistance: 10
    tapeSlot:
      insertSound: /Audio/_Rayten/TapePlayer/insert_tape.ogg
      ejectSound: /Audio/_Rayten/TapePlayer/eject_tape.ogg
      whitelist:
        components:
        - MusicTape
    buttonSound: /Audio/_Rayten/TapePlayer/switch.ogg
  - type: Item
    size: Small
  - type: ItemSlots
  - type: ContainerContainer
    containers:
      tape: !type:ContainerSlot
  - type: ActivatableUI
    key: enum.TapePlayerUiKey.Key
  - type: UserInterface
    interfaces:
      enum.TapePlayerUiKey.Key:
        type: TapePlayerBoundUserInterface
