- type: entity
  parent: BasePlushie
  id: KeterPlushie
  name: плюшевая Кетер-Оливер
  description:
  components:
  - type: Sprite
    sprite: _Rayten/Objects/Fun/KeterPlushie.rsi
    state: icon
  - type: Item
    sprite: _Rayten/Objects/Fun/KeterPlushie.rsi
  - type: EmitSoundOnUse
    sound: &PlushieLizardSound
      path: /Audio/Items/Toys/weh.ogg
      params:
        volume: -5
  - type: EmitSoundOnLand
    sound: *PlushieLizardSound
  - type: EmitSoundOnActivate
    sound: *PlushieLizardSound
  - type: EmitSoundOnTrigger
    sound: *PlushieLizardSound
  - type: EmitSoundOnCollide
    sound: *PlushieLizardSound
  - type: Food
    requiresSpecialDigestion: true
    useSound: *PlushieLizardSound
  - type: MeleeWeapon
    wideAnimationRotation: 180
    soundHit: *PlushieLizardSound
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: JuiceThatMakesYouWeh
        Quantity: 30
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 20
        reagents:
        - ReagentId: Fiber
          Quantity: 10
        - ReagentId: JuiceThatMakesYouWeh
          Quantity: 10
  - type: Clothing
    quickEquip: false
    sprite: Objects/Fun/Plushies/lizard.rsi
    slots:
    - HEAD
  - type: Speech
    speechVerb: Reptilian # for pais (In the secret stash)
  - type: FoodSequenceElement
    entries:
      CottonBurger: LizardPlushie
  - type: Tag
    tags:
    - Payload
    - ClothMade
    - PlushieLizard
